server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # Content-hashed assets — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry document, so new deploys are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
